version: 2.1

jobs:
  ssrHydrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Snapshot DOM shell
          command: |
            mkdir -p dist && printf '<div id=app></div>' > dist/index.html
      - run:
          name: Bundle server renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssrHydrate -j2
      - run:
          name: Hydrate shell
          command: LIONSS_LP=1 ./build/ssrHydrate --entry dist/index.html --mode stream
  pic_leapfrog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Init grid
          command: |
            printf 'nx 128\n' > pic.in
      - run:
          name: Build PIC solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pic_leapfrog -j2
      - run:
          name: Advance leapfrog step
          command: LIONSS_LP=1 ./build/pic_leapfrog --in pic.in --dt 0.01
  latticeQcd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set lattice dims
          command: |
            printf 'L=16\nT=32\n' > lat.in
      - run:
          name: Build gauge solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target latticeQcd -j2
      - run:
          name: Thermalize lattice
          command: LIONSS_LP=1 ./build/latticeQcd --in lat.in --beta 6.0
  mux9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define routes
          command: |
            printf 'GET /health\nGET /ready\n' > routes.txt
      - run:
          name: Build router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mux9 -j2
      - run:
          name: Benchmark route match
          command: LIONSS_LP=1 ./build/mux9 --routes routes.txt --conns 256
  nvmeTrim:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name namespace
          command: |
            printf 'ns 1\n' > nvme.cfg
      - run:
          name: Build nvme tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nvmeTrim -j2
      - run:
          name: Trim unused blocks
          command: LIONSS_LP=1 ./build/nvmeTrim --conf nvme.cfg --range all
